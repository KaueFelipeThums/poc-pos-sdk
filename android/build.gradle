buildscript {
  ext.getExtOrDefault = { name, defaultValue = null ->
    if (rootProject.ext.has(name)) return rootProject.ext.get(name)
    if (project.hasProperty("PocPosSdk_$name")) return project.properties["PocPosSdk_$name"]
    return defaultValue
  }

  ext.getExtOrIntegerDefault = { name, defaultValue = null ->
    def value = null

    if (rootProject.ext.has(name)) {
      value = rootProject.ext.get(name)
    } else if (project.hasProperty("PocPosSdk_$name")) {
      value = project.properties["PocPosSdk_$name"]
    }

    if (value == null || value == "") return defaultValue
    return Integer.parseInt(value.toString())
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

ext {
  CardAdministratorEnum = [
    REDE: 'REDE',
  ]

  CardModelEnum = [
    N960K: 'N960K',
    L400: 'L400',
  ]
}

def administrator = getExtOrDefault("ADMINISTRATOR", "")
def model = getExtOrDefault("MODEL", "")

android {
  namespace "com.pocpossdk"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    buildConfigField "String", "ADMINISTRATOR", "\"${administrator}\""
    buildConfigField "String", "MODEL", "\"${model}\""

    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}



repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  switch (administrator) {
    case CardAdministratorEnum.REDE:
      implementation 'com.google.code.gson:gson:2.8.5'
      implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.6.0'
      implementation 'org.jetbrains.kotlin:kotlin-reflect:1.6.0'

      implementation 'androidx.appcompat:appcompat:1.1.0'
      implementation 'androidx.activity:activity-ktx:1.2.0'
      implementation 'androidx.fragment:fragment-ktx:1.3.0'
      implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

      switch (model) {
        case CardModelEnum.N960K:
          implementation fileTree(dir: 'libs/rede', include: ['sdk-rede-n960-4.3.14.release.aar'])
          break

        case CardModelEnum.L400:
          implementation fileTree(dir: 'libs/rede', include: ['sdk-rede-l400-4.3.9.debug.aar'])
          break
      }
      break
  }
}
